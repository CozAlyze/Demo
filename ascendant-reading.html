<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Ascendant · CozAlyze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* COZALYZE · ASCENDANT FULL READING · R1.2
   One template for all three readings: ?sys=western, ?sys=vedic or ?sys=combined
   (How They Work Together: same layout, no frame art, both sign names).
   Signs and copy come from ascendant-library.js (shared with your-ascendants.html). */
:root{
  --navy:#030b17;
  --cream:#EBE5D0; --title:#F3EEE3; --champ:#D9BC8C;
  --blue:#A9CDF2; --blue-glow:rgba(96,156,232,.8);
  --gold:#E8CB98; --gold-glow:rgba(222,168,92,.7);
  --head:"Cinzel",Georgia,serif;
  --body:"EB Garamond",Georgia,serif;
  --glyph:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--navy);color:var(--cream);-webkit-text-size-adjust:100%}
.sky{position:fixed;inset:0;z-index:0;background:var(--navy) url("reading-bg.jpg?v=1") center top/cover no-repeat;pointer-events:none}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 8.5% calc(40px + env(safe-area-inset-bottom));text-align:center}
.logo{display:block;width:clamp(104px,30vw,150px);height:auto;margin:0 auto}
.frame{position:relative;width:clamp(190px,58vw,290px);margin:clamp(10px,3vw,18px) auto 0;container-type:inline-size}
.frame img{display:block;width:100%;height:auto}
.glyph{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font-family:var(--glyph);line-height:1}
.western .glyph{font-size:28cqw;color:var(--blue);text-shadow:0 0 2cqw var(--blue-glow),0 0 6cqw var(--blue-glow)}
.vedic .glyph{font-size:26cqw;color:var(--gold);text-shadow:0 0 2cqw var(--gold-glow),0 0 6cqw var(--gold-glow)}
.sys{font-family:var(--head);font-weight:500;font-size:clamp(14px,4.3vw,19px);letter-spacing:.3em;margin-right:-.3em;color:var(--cream);margin-top:clamp(14px,4vw,24px)}
.your{font-family:var(--head);font-weight:500;font-size:clamp(13px,4vw,18px);letter-spacing:.28em;margin-right:-.28em;color:var(--champ);margin-top:.7em}
.sign{font-family:var(--head);font-weight:500;font-size:clamp(30px,10.4vw,62px);line-height:1.1;letter-spacing:.02em;color:var(--title);white-space:nowrap;margin-top:.12em}
.meet{font-family:var(--head);font-weight:500;font-size:clamp(12px,3.8vw,20px);letter-spacing:.2em;margin-right:-.2em;white-space:nowrap;color:var(--champ);margin-top:.35em}
.reading{text-align:left;margin-top:clamp(24px,6.5vw,36px)}
.reading p{font-family:var(--body);font-weight:400;font-size:clamp(18px,4.9vw,21px);line-height:1.55;color:var(--cream)}
.reading p+p{margin-top:1.05em}
.reading .dev{font-style:italic;color:var(--champ)}
.note{font-family:var(--body);font-style:italic;font-size:clamp(15px,4.2vw,18px);color:var(--cream);opacity:.85;margin-top:2.2em}
.back{display:inline-block;margin-top:1.9em;padding:10px 6px;font-family:var(--head);font-weight:500;font-size:clamp(13px,3.9vw,16px);letter-spacing:.2em;color:var(--champ);text-decoration:none;-webkit-tap-highlight-color:transparent}
.back:focus-visible{outline:1px solid var(--champ);outline-offset:4px}
/* item 6 (Sep 22): Next sits on the same row as Back, same style, right-aligned */
.pager{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.pager .back{text-align:left;flex:1 1 0}
.pager .next{text-align:right}
.combined .frame{display:none}
.stamp{position:fixed;right:6px;bottom:2px;z-index:2;font:8px/1 var(--head);letter-spacing:.08em;color:rgba(204,164,102,.45);pointer-events:none}
</style>
<script src="coz-saved.js?v=1"></script>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main id="page">
  <img class="logo" src="coz-logo.png?v=1" alt="CozAlyze">
  <div class="frame">
    <img id="frameImg" src="" alt="">
    <span class="glyph" id="glyph" role="img"></span>
  </div>
  <p class="sys" id="sys"></p>
  <p class="your" id="your">YOUR ASCENDANT</p>
  <h1 class="sign" id="sign"></h1>
  <p class="meet" id="meet">HOW YOU MEET THE WORLD</p>
  <article class="reading" id="reading"></article>
  <p class="note">These themes describe possible patterns—not fixed outcomes.</p>
  <div class="pager">
    <a class="back" id="back" href="your-ascendants.html">&lsaquo; BACK TO YOUR ASCENDANTS</a>
    <a class="back next" id="next" href="#" hidden></a>
  </div>
</main>
<div class="stamp">ASCENDANT READING · R1.4 · early readings</div>

<script src="dev-review-engine.js?v=8"></script>
<script src="ascendant-library.js?v=5"></script>
<script>
(function(){
  var A=window.COZ_ASC, q=new URLSearchParams(location.search);
  var qs=q.get("sys"), page=qs==="vedic"?"vedic":qs==="combined"?"combined":"western";
  var sys=page==="vedic"?"vedic":page==="combined"?"combined":"tropical";
  var main=document.getElementById("page");
  main.classList.add(page);
  if(page!=="combined") document.getElementById("frameImg").src=(page==="vedic"?"frame-vedic.png":"frame-western.png")+"?v=1";
  document.getElementById("sys").textContent=page==="vedic"?"VEDIC (SIDEREAL)":page==="combined"?"WESTERN + VEDIC":"WESTERN (TROPICAL)";
  if(page==="combined"){
    document.getElementById("your").textContent="YOUR ASCENDANTS";
    document.getElementById("meet").textContent="HOW THEY WORK TOGETHER";
  }
  var label=page==="vedic"?"Vedic":"Western";
  var g=document.getElementById("glyph"), h=document.getElementById("sign"), r=document.getElementById("reading");
  g.setAttribute("aria-hidden","true");
  r.innerHTML='<p class="dev">Preparing your reading\u2026</p>';

  /* keep the sign name on one line inside the column on any screen */
  function fit(){
    h.style.fontSize="";
    var t=h.querySelector("span"); if(!t) return;
    var fs=parseFloat(getComputedStyle(h).fontSize);
    var floor=page==="combined"?14:18;
    while(t.getBoundingClientRect().width>h.clientWidth && fs>floor){ fs-=0.5; h.style.fontSize=fs+"px"; }
  }
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
  addEventListener("resize",fit);
  function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  A.ensurePair().then(function(res){
    if(!res.ok){ r.innerHTML='<p class="dev">'+esc(A.PAIR_FAIL)+'</p>'; return; }
    if(sys==="combined"){
      var ws=res.pair.tropical.sign, vs=res.pair.vedic.sign;
      h.innerHTML="<span>"+ws.toUpperCase()+" + "+vs.toUpperCase()+"</span>";
      fit();
      document.title="How They Work Together \u00B7 Your Ascendants \u00B7 CozAlyze";
    } else {
      var sign=sys==="tropical"?res.pair.tropical.sign:res.pair.vedic.sign;
      g.textContent=A.GLYPH[sign]+"\uFE0E";
      g.removeAttribute("aria-hidden");
      g.setAttribute("aria-label",A.cap(sign)+" zodiac glyph");
      h.innerHTML="<span>"+sign.toUpperCase()+" RISING</span>";
      fit();
      document.title=A.cap(sign)+" Rising \u00B7 "+label+" Ascendant \u00B7 CozAlyze";
    }
    return A.getReading(sys,res).then(function(rec){
      r.innerHTML=rec.paragraphs.map(function(t){ return "<p>"+esc(t)+"</p>"; }).join("");
    }).catch(function(e){
      r.innerHTML='<p class="dev">'+esc((e&&e.message)||"DEV: reading unavailable")+'</p>';
    });
  });

  /* item 6 (Sep 22): Next steps through the Compare sequence.
     Tropical Ascendant -> Vedic Ascendant -> Your Current Timing. */
  var NEXT = { western: ["VEDIC ASCENDANT", "ascendant-reading.html?sys=vedic"],
               vedic:   ["YOUR CURRENT TIMING", "compare-current-timing.html"],
               combined:["YOUR CURRENT TIMING", "compare-current-timing.html"] };
  var nx = document.getElementById("next");
  if (NEXT[page]) { nx.innerHTML = esc(NEXT[page][0]) + " &rsaquo;"; nx.href = NEXT[page][1]; nx.hidden = false; }
  /* back: return to the Ascendants page where the reader left it */
  document.getElementById("back").addEventListener("click",function(e){
    var ref=document.referrer||"";
    if(ref.indexOf("your-ascendants.html")>=0 && history.length>1){ e.preventDefault(); history.back(); }
  });
})();
</script>
</body>
</html>
