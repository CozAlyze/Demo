<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Current Timing · Your Full Reading · CozAlyze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Montserrat:wght@300;400;500&family=EB+Garamond:ital@1&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="compare-timing-reading-top.jpg?v=1">
<style>
/* COZALYZE · COMPARE · CURRENT TIMING · CT2.1 · full reading
   Page shell, type, dividers, accordion, pager and nav are the Combined
   Reading (CR2.x) implementation, reused as-is: tokens, --k/--K scaling,
   .div star divider, .acc grid accordion, .pager, .art-bottom nav.
   His background (1206x2622) in three verbatim pieces so the page grows with
   the reading: compare-timing-reading-top.jpg (rows 0-2220: sky, logo,
   wordmark), compare-timing-reading-mid.png (one row averaged from his plain
   band 2220-2340, repeated), compare-timing-reading-bottom.jpg (rows
   2340-2622: tagline + nav). Nothing is stretched. All wording is live. */
:root{ --cream:#EEE7D8; --gold:#D6B98C; --gold-soft:#B89A6E; --navy:rgb(0,2,8);
  --head:"Cinzel",Georgia,serif; --sans:"Montserrat","Helvetica Neue",Arial,sans-serif; --body:"EB Garamond",Georgia,serif; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--navy);color:var(--cream);-webkit-text-size-adjust:100%;overflow-x:hidden}
body{padding-bottom:env(safe-area-inset-bottom)}
.page{position:relative;width:100%;max-width:640px;margin:0 auto;container-type:inline-size;text-align:center;
  background:url("compare-timing-reading-top.jpg?v=1") center top/100% auto no-repeat, url("compare-timing-reading-mid.png?v=1") center top/100% 1px repeat-y, var(--navy)}
.page,.page *{--k:calc(100cqw / 932);--K:calc(100cqw / 1206)}
.content{padding-top:calc(350 * var(--K));min-height:calc(2220 * var(--K));padding-bottom:calc(40 * var(--K))}
.content *{min-width:0}
h1{font-family:var(--head);font-weight:500;font-size:max(24px,calc(66 * var(--k)));line-height:1.02;letter-spacing:.02em;color:var(--cream);
  text-shadow:0 calc(3 * var(--k)) calc(10 * var(--k)) rgba(0,0,0,.65);padding:0 calc(40 * var(--k))}
.full{font-family:var(--head);font-weight:400;font-size:max(17px,calc(44 * var(--k)));line-height:1.1;color:var(--cream);margin-top:calc(14 * var(--k))}
.sys{font-family:var(--sans);font-weight:400;font-size:max(12px,calc(24 * var(--k)));letter-spacing:.04em;margin-top:calc(18 * var(--k));padding:0 calc(40 * var(--k))}
.theme{font-family:var(--sans);font-weight:400;font-size:max(10.5px,calc(19 * var(--k)));line-height:1.62;letter-spacing:.2em;color:var(--gold);
  margin-top:calc(26 * var(--k));padding:0 calc(50 * var(--k));overflow-wrap:anywhere}
.theme span{white-space:nowrap}
.status{font-family:var(--sans);font-weight:300;font-size:max(15px,calc(28 * var(--k)));line-height:1.5;color:var(--cream);margin:calc(40 * var(--k)) calc(110 * var(--k)) 0}
.div{height:calc(28 * var(--k));margin:calc(38 * var(--k)) calc(90 * var(--k)) 0;display:flex;align-items:center}
.div::before,.div::after{content:"";flex:1;height:1px;background:var(--gold-soft);opacity:.85}
.div svg{width:calc(24 * var(--k));height:calc(24 * var(--k));margin:0 calc(6 * var(--k));color:var(--gold);flex:none}
.sec{padding:0 calc(90 * var(--k))}
.acc-btn{appearance:none;-webkit-appearance:none;background:none;border:0;cursor:pointer;width:100%;min-height:44px;
  display:flex;align-items:center;gap:calc(24 * var(--k));text-align:left;color:inherit;padding:calc(26 * var(--k)) 0 calc(8 * var(--k));
  -webkit-tap-highlight-color:transparent}
.acc-btn:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.acc-btn .txt{flex:1;min-width:0}
.acc-btn .t{display:block;font-family:var(--head);font-weight:500;font-size:max(16px,calc(38 * var(--k)));letter-spacing:.06em;line-height:1.15;color:var(--gold);overflow-wrap:anywhere}
.acc-btn .sub{display:block;font-family:var(--sans);font-weight:300;font-size:max(13px,calc(25 * var(--k)));line-height:1.4;letter-spacing:.015em;color:var(--cream);margin-top:calc(8 * var(--k))}
.acc-btn svg{width:max(18px,calc(34 * var(--k)));height:max(18px,calc(34 * var(--k)));flex:none;color:var(--gold);transition:transform .45s ease}
.acc-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
.acc.open{grid-template-rows:1fr}
.acc-in{overflow:hidden;visibility:hidden;transition:visibility 0s .45s}
.acc.open .acc-in{visibility:visible;transition:visibility 0s 0s}
.body{text-align:left;padding:calc(18 * var(--k)) 0 calc(6 * var(--k))}
.body p{font-family:var(--sans);font-weight:300;font-size:max(15px,calc(30 * var(--k)));line-height:1.6;color:var(--cream);overflow-wrap:anywhere}
.body p+p{margin-top:.95em}
.method{margin-top:calc(46 * var(--k))}
.mlink{appearance:none;-webkit-appearance:none;background:none;border:0;cursor:pointer;min-height:44px;padding:0 12px;
  font-family:var(--body);font-style:italic;font-size:clamp(15px,4.2vw,18px);color:var(--gold);-webkit-tap-highlight-color:transparent}
.mlink:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
.note{font-family:var(--body);font-style:italic;font-size:clamp(15px,4.2vw,18px);color:var(--cream);opacity:.85;margin:calc(10 * var(--k)) calc(90 * var(--k)) 0}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:calc(46 * var(--k)) calc(90 * var(--k)) 0}
.pager a{font-family:var(--head);font-weight:500;font-size:max(11.5px,calc(22 * var(--k)));letter-spacing:.18em;color:var(--gold);text-decoration:none;
  padding:10px 4px;min-height:44px;display:inline-flex;align-items:center;-webkit-tap-highlight-color:transparent}
.pager a:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
.art-bottom{position:relative;height:calc(282 * var(--K));background:url("compare-timing-reading-bottom.jpg?v=1") center top/100% auto no-repeat}
.nav a{position:absolute;top:calc(172 * var(--K));height:calc(80 * var(--K));min-height:44px;display:block;-webkit-tap-highlight-color:transparent}
.nav .home{left:calc(127 * var(--K));width:calc(240 * var(--K))}
.nav .saved{left:calc(470 * var(--K));width:calc(225 * var(--K))}
.nav .acct{left:calc(830 * var(--K));width:calc(219 * var(--K))}
.nav a:focus-visible{outline:1px solid var(--gold);outline-offset:2px}

/* Methodology panel. The platform has no content modal yet (its role=dialog
   elements are the reveal overlays), so this is a native <dialog> built only
   from the page tokens above: navy, champagne-gold rule, Cinzel, Montserrat. */
dialog.mdl{border:1px solid var(--gold-soft);background:var(--navy);color:var(--cream);padding:0;width:min(560px,calc(100vw - 28px));
  max-height:calc(100dvh - 40px - env(safe-area-inset-bottom));margin:auto;overflow:auto}
dialog.mdl::backdrop{background:rgba(0,2,8,.78)}
.mdl-in{padding:22px 20px 26px;text-align:left}
.mdl-hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mdl h2{font-family:var(--head);font-weight:500;font-size:clamp(17px,5vw,22px);letter-spacing:.04em;color:var(--gold);line-height:1.2}
.mdl-x{appearance:none;background:none;border:0;cursor:pointer;min-width:44px;min-height:44px;font-family:var(--head);font-size:13px;letter-spacing:.16em;color:var(--gold)}
.mdl-x:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
.mdl h3{font-family:var(--head);font-weight:500;font-size:14px;letter-spacing:.14em;color:var(--gold);margin-top:22px;padding-bottom:8px;border-bottom:1px solid rgba(184,154,110,.55)}
.mdl dl{margin-top:6px}
.mdl dt{font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.08em;color:var(--gold-soft);margin-top:12px}
.mdl dd{font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.5;color:var(--cream);overflow-wrap:anywhere}

.stamp{position:fixed;right:6px;bottom:2px;z-index:2;font:8px/1 var(--sans);letter-spacing:.08em;color:rgba(204,164,102,.45);pointer-events:none}
@media (prefers-reduced-motion:reduce){.acc,.acc-btn svg,.acc-in{transition:none}}
</style>
</head>
<body>
<main class="page">
 <div class="content">
  <h1>Your Current Timing</h1>
  <p class="full">Your Full Reading</p>
  <p class="sys">Vedic Life Cycle + Tropical Transits</p>
  <p class="theme" id="tag"></p>
  <p class="status" id="status" hidden></p>
  <div id="reading"></div>
  <nav class="pager" aria-label="Reading navigation">
    <a href="compare-current-timing.html">&lsaquo; TIMING OVERVIEW</a>
    <a href="compare-birth-charts.html">YOUR BIRTH CHARTS &rsaquo;</a>
  </nav>
 </div>
 <div class="art-bottom">
  <nav class="nav" aria-label="Main">
    <a class="home" href="compare-reading.html" aria-label="Home"></a>
    <a class="saved" href="#" aria-label="Saved"></a>
    <a class="acct" href="#" aria-label="Profile"></a>
  </nav>
 </div>
</main>

<dialog class="mdl" id="mdl" aria-labelledby="mdlTitle">
  <div class="mdl-in">
    <div class="mdl-hd">
      <h2 id="mdlTitle">How This Was Calculated</h2>
      <button class="mdl-x" type="button" id="mdlClose" aria-label="Close">CLOSE</button>
    </div>
    <div id="mdlBody"></div>
  </div>
</dialog>
<div class="stamp">CURRENT TIMING · CT2.1 · full reading</div>

<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script src="coz-graha.js"></script>
<script src="dev-review-engine.js?v=8"></script>
<script src="ascendant-library.js?v=4"></script>
<script src="compare-current-timing.js?v=2"></script>
<script>
(function(){
  'use strict';
  var TM = window.COZ_TIMING;
  var $ = function(id){ return document.getElementById(id); };
  var STAR = '<div class="div" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0 13.6 10.4 24 12 13.6 13.6 12 24 10.4 13.6 0 12 10.4 10.4Z"/></svg></div>';
  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>';
  var NOTE = 'These are themes that may be present\u2014not predictions of what will happen.';

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function day(iso){ var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric', timeZone:'UTC' }); }
  function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  function section(s, i){
    var id = 'acc-' + s.id;
    return '<section class="sec" id="' + s.id + '">' +
      '<h2><button class="acc-btn" type="button" id="btn-' + s.id + '" aria-expanded="false" aria-controls="' + id + '">' +
        '<span class="txt"><span class="t">' + esc(s.title.toUpperCase()) + '</span><span class="sub">' + esc(s.subtitle) + '</span></span>' + CHEV +
      '</button></h2>' +
      '<div class="acc" id="' + id + '" role="region" aria-labelledby="btn-' + s.id + '"><div class="acc-in"><div class="body">' +
        s.paras.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') +
      '</div></div></div>' +
    '</section>';
  }

  /* accordion: one section open at a time (same behaviour as combined-reading.html) */
  function wireAccordion(){
    var buttons = [].slice.call(document.querySelectorAll('.acc-btn'));
    function setOpen(btn, open){
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      $(btn.getAttribute('aria-controls')).classList.toggle('open', open);
    }
    buttons.forEach(function(btn){
      btn.addEventListener('click', function(){
        var opening = btn.getAttribute('aria-expanded') !== 'true';
        buttons.forEach(function(b){ if (b !== btn) setOpen(b, false); });
        setOpen(btn, opening);
      });
    });
    if (buttons[0]) setOpen(buttons[0], true);
  }

  function methodology(d){
    var v = d.vedic, t = d.tropical, lc = v.lifeCycle, P = d.policy, calc = v.calculation || {}, st = t.settings || {}, cl = t.client || {};
    function rows(list){ return '<dl>' + list.filter(function(r){ return r[1]; }).map(function(r){ return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>'; }
    /* exact engine value, never rounded */
    var year = lc.yearLengthDays ? (lc.mode === 'synodic_354_fixed' ? 'Synodic year, ' : lc.mode + ', ') + String(lc.yearLengthDays) + ' days' : null;
    var shown = d.fast.concat(d.slow ? [d.slow] : []);
    var active = shown.length ? shown.map(function(h){
      return h.planet + ' ' + h.aspect + ' natal ' + h.target + ', orb ' + h.orb.toFixed(2) + '\u00B0, ' + cap(h.status);
    }).join('\n') : 'None within the current orbs';
    var html =
      '<h3>VEDIC LIFE CYCLE</h3>' + rows([
        ['Dasha system', lc.system === 'vimshottari' ? 'Vimshottari Dasha' : lc.system],
        ['Zodiac', 'Sidereal'],
        ['Ayanamsha', calc.ayanamsha],
        ['Houses', calc.houses],
        ['Nodes', calc.nodes],
        ['Year length', year],
        ['Current Mahadasha', d.md.lord + ', ' + day(d.md.startTimestamp) + ' to ' + day(d.md.endTimestamp)],
        ['Current Antardasha', d.ad.lord + ', ' + day(d.ad.startTimestamp) + ' to ' + day(d.ad.endTimestamp)]
      ]) +
      '<h3>TROPICAL TRANSITS</h3>' + rows([
        ['Zodiac', st.zodiac || 'Tropical'],
        ['Calculated', d.now.toLocaleString('en-US', { dateStyle:'medium', timeStyle:'short' })],
        ['Natal chart', [cl.birthDate, cl.birthTime, cl.locationLabel].filter(Boolean).join(', ')],
        ['Natal houses', st.resolvedHouseSystem],
        ['Aspects and orbs', P.aspects.map(function(a){ return cap(a.type) + ' ' + a.angle + '\u00B0, orb ' + a.orb + '\u00B0'; }).join('\n')],
        ['Angles and nodes', Object.keys(P.pointOrbCap).map(function(k){ return k + ' ' + P.pointOrbCap[k] + '\u00B0'; }).join(', ') + ' maximum orb'],
        ['Transiting planets', P.fastPlanets.concat(P.slowPlanets).join(', ') + (P.moonIncluded ? ', Moon' : '; the Moon is not included')],
        ['Shown', P.announcementWindowDays ? 'Contacts within orb, and up to ' + P.announcementWindowDays + ' days ahead' : 'Only contacts already within orb'],
        ['Active transits', active],
        ['Nodes', (st.nodeType || P.nodeType) + ' node']
      ]);
    $('mdlBody').innerHTML = html.replace(/\n/g, '<br>');
  }

  function wireMethodology(){
    var dlg = $('mdl'), link = $('mlink');
    link.addEventListener('click', function(){ if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); $('mdlClose').focus(); });
    $('mdlClose').addEventListener('click', function(){ dlg.close ? dlg.close() : dlg.removeAttribute('open'); });
    dlg.addEventListener('close', function(){ link.focus(); });                 /* Escape closes natively and lands here too */
    dlg.addEventListener('click', function(e){ if (e.target === dlg) dlg.close(); });
  }

  TM.load().then(function(d){
    if (!d.ok){
      $('status').textContent = TM.FAIL; $('status').hidden = false;
      if (window.console) console.warn('[CURRENT TIMING] fail-closed: ' + d.reason);
      return;
    }
    var tx = d.text;
    $('tag').innerHTML = tx.tag.map(function(x, i, all){
      return '<span>' + esc(x.toUpperCase()) + (i < all.length - 1 ? '\u00a0\u2022' : '') + '</span>';
    }).join(' ');
    var html = STAR;
    tx.sections.forEach(function(s, i){ html += (i ? STAR : '') + section(s, i); });
    html += '<p class="method"><button class="mlink" type="button" id="mlink" aria-haspopup="dialog">Methodology</button></p>' +
            '<p class="note">' + esc(NOTE) + '</p>';
    $('reading').innerHTML = html;
    wireAccordion();
    methodology(d);
    wireMethodology();
  });
})();
</script>
</body>
</html>
