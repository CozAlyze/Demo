<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000f26">
<title>Your Tropical Reading · CozAlyze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   COZALYZE · COMPLETE TROPICAL READING · T5.1 · writer status
   Paid dashboard + reveal + six reading sections in ONE document
   (standing rule: no iframe, no page navigation between them).
   Design tokens and structure follow the supplied spec verbatim.
   ============================================================ */
:root {
  --vedic-navy: #000f26;
  --vedic-gold: #d4a178;
  --vedic-gold-muted: rgba(212, 161, 120, 0.65);
  --vedic-ivory: #e5d4c5;
  --vedic-ivory-muted: rgba(229, 212, 197, 0.88);
  --display-font: "Cormorant Garamond", Georgia, serif;
  --body-font: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --side-pad: 28px;
  --dash-zoom: 1;            /* opens showing the whole art, then eases to --dash-zoom-in */
  --dash-zoom-in: 1.3;    /* same landing as the Vedic dashboard; the bottom nav pill sits below the screen at this zoom */
}
@media (max-width: 374px) { :root { --side-pad: 20px; } }

* { box-sizing: border-box; }
html { background: var(--vedic-navy); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--vedic-navy);
  color: var(--vedic-ivory);
  font-family: var(--body-font);
  -webkit-font-smoothing: antialiased;
}

/* Fixed background layer: iOS ignores background-attachment on body,
   so the image lives on its own fixed layer behind the scrolling content. */
.vedic-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-color: var(--vedic-navy);
  background-image: url("vedic-moon-bg.png");
  background-size: cover;
  background-position: top center;
  background-repeat: no-repeat;
  pointer-events: none;
}

.vedic-reading-page {
  position: relative;
  z-index: 1;
  min-height: 100svh;
  padding:
    calc(env(safe-area-inset-top) + 24px)
    var(--side-pad)
    calc(env(safe-area-inset-bottom) + 24px);
}

.vedic-reading-content {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  animation: vedicFadeIn 240ms ease-out;
}
@keyframes vedicFadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .vedic-reading-content { animation: none; }
  .stage { transition: none; }
}

/* ---------- header ---------- */
.vedic-back-button {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 10px);
  left: calc(var(--side-pad) - 10px);
  width: 44px;
  height: 44px;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  color: var(--vedic-gold);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.vedic-back-button svg { width: 30px; height: 20px; display: block; }
.vedic-back-button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }

.vedic-header {
  text-align: center;
  padding-top: 6px;
}
/* His logo lockup (emblem + CozAlyze wordmark) as one image, white keyed out.
   Width is set so the wordmark reads at the spec's 28–30px display size. */
.vedic-logo {
  display: block;
  width: 140px;
  height: auto;
  margin: 0 auto;
}
.vedic-eyebrow {
  font-family: var(--body-font);
  font-size: clamp(13px, 3.5vw, 14.5px);
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--vedic-ivory-muted);
  margin: 12px 0 0;
  padding-left: 0.28em; /* optical centre with the trailing tracking */
}
.vedic-counter {
  font-family: var(--display-font);
  font-size: clamp(27px, 7.2vw, 31px);
  font-weight: 500;
  letter-spacing: 0.06em;
  font-variant-numeric: lining-nums;
  color: var(--vedic-gold);
  margin: 40px 0 0;
}

/* ---------- ornamental divider ---------- */
.vedic-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: min(100%, 420px);
  margin: 14px auto;
  color: var(--vedic-gold);
}
.vedic-divider::before,
.vedic-divider::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--vedic-gold-muted);
}
.vedic-divider svg { width: 16px; height: 16px; flex: 0 0 auto; display: block; }

/* ---------- title ---------- */
.vedic-title {
  font-family: var(--display-font);
  font-size: clamp(2.6rem, 11.5vw, 3.4rem);
  font-weight: 500;
  line-height: 0.98;
  color: var(--vedic-gold);
  text-align: center;
  text-wrap: balance;
  margin: 10px 0;
}
.vedic-title--long {
  font-size: clamp(2.35rem, 10vw, 2.9rem);
}

/* ---------- body ---------- */
.vedic-body {
  font-family: var(--body-font);
  font-size: clamp(1.25rem, 5.4vw, 1.4rem);
  line-height: 1.55;
  font-weight: 400;
  color: var(--vedic-ivory);
  margin-top: 24px;
}
.vedic-body p { margin: 0 0 1.35em; }
.vedic-body p:last-child { margin-bottom: 0; }
.vedic-body p.dev-label { font-size: 14px; font-style: italic; color: #8b8272; }

/* ---------- bottom navigation ---------- */
.vedic-nav { margin-top: 34px; }
.vedic-nav-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--vedic-gold);
}
.vedic-nav-rule::before,
.vedic-nav-rule::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--vedic-gold-muted);
}
.vedic-nav-rule svg { width: 14px; height: 14px; flex: 0 0 auto; display: block; }
.vedic-nav-links {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding-top: 6px;
}
.vedic-nav a,
.vedic-nav button {
  font-family: var(--body-font);
  font-size: clamp(16px, 4.3vw, 18px);
  font-weight: 400;
  color: var(--vedic-gold);
  text-decoration: none;
  background: transparent;
  border: 0;
  padding: 0;
  margin: 0;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  text-align: left;
}
.vedic-nav a:focus-visible,
.vedic-nav button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }
.vedic-nav .vedic-nav-next { text-align: right; justify-content: flex-end; }
.vedic-nav svg:not(.vedic-nav-rule svg) { width: 24px; height: 15px; flex: 0 0 auto; }

/* ============================================================
   PAID DASHBOARD  (his art = frame 0 of the reveal clip, so the
   dashboard and the video's first frame are pixel-identical)
   ============================================================ */
body[data-view="dashboard"] .vedic-reading-page,
body[data-view="dashboard"] .vedic-bg { display: none; }
body[data-view="reading"] .dash { display: none; }

.dash {
  position: fixed;
  inset: 0;
  z-index: 5;
  background: var(--vedic-navy);
  overflow: hidden;
}
/* one shared stage: contain-fit box with the clip's exact aspect, centred */
.stage {
  position: absolute;
  left: 50%;
  top: 50%;
  aspect-ratio: 972 / 2128;
  width: min(100vw, calc(100svh * 972 / 2128));   /* contain-fit: the whole art */
  /* --dash-zoom 1 = whole art; above 1 the stage scales up around its centre and
     crops evenly. Done with transform so iOS animates it smoothly. */
  transform: translate(-50%, -50%) scale(var(--dash-zoom, 1));
  transition: transform 1400ms cubic-bezier(0.22, 0.61, 0.36, 1);
  will-change: transform;
  container-type: inline-size;
  overflow: hidden;
}
.stage-art,
.stage video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
  background: var(--vedic-navy);
}
.stage video { background: transparent; }   /* the art under it shows until the first frame paints */
.hot {
  position: absolute;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  color: transparent;
  font-size: 0;
}
.hot:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 2px; border-radius: 8px; }
.hot[disabled] { cursor: default; }
/* live ascendant: shown ONLY when the sign is not the sample Leo baked into the art */
.asc-patch, .asc-glyph, .asc-label { position: absolute; display: none; pointer-events: none; }
.stage[data-asc-live="1"] .asc-patch,
.stage[data-asc-live="1"] .asc-glyph,
.stage[data-asc-live="1"] .asc-label { display: block; }
/* geometry measured on the 972-wide art, all in cqw so x and y share one scale:
   baked lion ring centred (215,1378) outer radius ~44 (~48 with its points), baked "Leo" at x 332–383, y 1394–1417 */
.asc-patch-glyph {
  left: 16.82cqw; top: 136.47cqw;
  width: 10.6cqw; height: 10.6cqw;
  border-radius: 50%;
  background: radial-gradient(circle, rgb(5,17,33) 0 80%, rgba(5,17,33,0) 100%);
}
.asc-patch-text {
  left: 33.7cqw; top: 142.6cqw;
  width: 6.8cqw; height: 4.1cqw;
  background: radial-gradient(ellipse at center, rgb(5,17,33) 0 60%, rgba(5,17,33,0) 100%);
}
.asc-glyph {                       /* his ring-<sign>.png, sized so its ring matches the baked one */
  left: 17.08cqw; top: 136.73cqw;
  width: 10.1cqw; height: 10.1cqw;
}
.asc-glyph img { display: block; width: 100%; height: 100%; }
.asc-label {
  left: 34.26cqw; top: 143.0cqw;
  font: 500 3.5cqw/1 var(--display-font);
  color: var(--vedic-ivory);
  white-space: nowrap;
}
.dash-preparing .hot-reading { opacity: 0.45; }

/* ============================================================
   REVEAL OVERLAY  (video plays once, then everything disappears
   and the reading emerges)
   ============================================================ */
.reveal {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background:#000;
  overflow: hidden;
  display: none;
}
.reveal.is-on { display: block; }
.reveal .asc-patch, .reveal .asc-glyph, .reveal .asc-label { transition: opacity 320ms ease-out; }
.reveal.asc-off .asc-patch, .reveal.asc-off .asc-glyph, .reveal.asc-off .asc-label { opacity: 0; }
.reveal-curtain {
  position: absolute;
  inset: 0;
  background: var(--vedic-navy);
  opacity: 0;
  transition: opacity 480ms ease-in;
  pointer-events: none;
}
.reveal.is-closing .reveal-curtain { opacity: 1; }
.reveal-back {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 10px);
  left: 18px;
  width: 44px;
  height: 44px;
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--vedic-gold);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.reveal-back svg { width: 30px; height: 20px; display: block; }
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
body.scroll-locked { overflow: hidden; touch-action: none; }

/* ---------- v20.1 shared reading footer (his ruling) ----------
   One footer across the whole reading: the CozAlyze line plus Home, Saved and
   Account. It reuses the #asqNav treatment already in this file rather than
   introducing a new look. The dashboard keeps its own painted footer, so this
   one stays hidden there, and it never prints. */
#cozFoot {
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(8,11,17,.86);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(201,161,94,.18);
  display:none;
}
#cozFoot .coz-foot-tag {
  text-align:center; font-family:'EB Garamond',serif; font-style:italic;
  font-size:13px; letter-spacing:.04em; color:#8b8272;
  padding:11px 20px 3px;
}
#cozFoot .coz-foot-links { display:flex; height:var(--asq-nav-h,64px); }
#cozFoot a {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; text-decoration:none; color:#8b8272; font-size:10.5px; letter-spacing:.06em;
  font-family:'EB Garamond',serif; -webkit-tap-highlight-color:transparent;
}
#cozFoot a svg {
  width:21px; height:21px; stroke:currentColor; fill:none;
  stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round;
}
#cozFoot a:active { color:var(--asq-gold,#c9a15e); }
#cozFoot a:focus-visible { outline:1px solid var(--asq-gold,#c9a15e); outline-offset:-4px; }
/* shown on the reading and, once the ascendant has settled, on the ascendant */
body[data-view="reading"] #cozFoot { display:block; }
body[data-view="ascendant"].asq-done #cozFoot { display:block; }
/* the footer owns the bottom of the screen, so the content clears it */
body[data-view="reading"] .vedic-reading-page {
  padding-bottom:calc(env(safe-area-inset-bottom) + var(--asq-nav-h,64px) + 60px);
}

/* ---------- build stamp (project standing rule) ---------- */
.vedic-stamp {
  position: fixed;
  right: 8px;
  bottom: calc(env(safe-area-inset-bottom) + 4px);
  z-index: 2;
  font: 9px/1 var(--body-font);
  letter-spacing: 0.08em;
  color: rgba(212, 161, 120, 0.35);
  pointer-events: none;
}

/* ============================================================
   ASCENDANT EMERGENCE (carried from VEDIC READING V2.5 "swell + unbroken field").
   Tapping the Ascendant door: black beat, the person's sign born small at the
   centre and swelling to full screen over 3s while it plays, then the reading
   rises beneath it and the sign pins to the top. Standing rule: the swell is
   part of every sign emergence and is never removed. Namespaced "asq".
   ============================================================ */
body[data-view="ascendant"] .dash,
body[data-view="ascendant"] .vedic-reading-page,
body[data-view="ascendant"] .vedic-bg,
body[data-view="ascendant"] .reveal { display: none !important; }
body:not([data-view="ascendant"]) .asq { display: none !important; }
body.asq-locked { overflow: hidden; height: 100dvh; }
body[data-view="ascendant"] { background: #0b0f16; }
.asq { --asq-bg:#0b0f16; --asq-gold:#c9a15e; --asq-champagne:#e9d7ae; --asq-ivory:#ddd3c2;
  --asq-hairline:rgba(201,161,94,.28); --asq-nav-h:64px; }
#asqVeil { position:fixed; inset:0; z-index:54; background:#000; opacity:0; pointer-events:none; transition:opacity .7s ease; }
#asqVeil.on { opacity:1; pointer-events:auto; }
#asqHero { position:fixed; top:0; left:0; right:0; height:100dvh; z-index:20; background:#000;
  display:flex; align-items:center; justify-content:center; overflow:hidden; will-change:height; transition:none; }
#asqHero.settling { transition:height 1.4s cubic-bezier(.22,.61,.21,1); }
#asqScale { width:100%; height:100%; transform-origin:center 46%; will-change:transform; }
#asqHero video { width:100%; height:100%; object-fit:contain; display:block; opacity:0; transition:opacity .9s ease; }
#asqHero.playing video { opacity:1; }
#asqHero.bloom #asqScale { transform:scale(.06); }
#asqHero.bloom.grown #asqScale { animation:asqBloom 3s linear forwards; }
@keyframes asqBloom { from { transform:scale(.06); } to { transform:scale(1); } }
#asqContent { position:fixed; top:0; left:0; right:0; z-index:19; background:var(--asq-bg); color:var(--asq-ivory);
  font-family:'EB Garamond', Georgia, serif; -webkit-font-smoothing:antialiased;
  transform:translateY(100dvh); will-change:transform; visibility:hidden; }
#asqContent.rising { visibility:visible; transition:transform 1.4s cubic-bezier(.22,.61,.21,1); }
body.asq-done #asqHero { position:fixed; top:0; left:0; right:0; height:var(--settled-h); z-index:20; background:#000; }
body.asq-done #asqContent { position:relative; z-index:1; margin-top:var(--settled-h); transform:none; visibility:visible; transition:none; }
#asqContent .wrap { max-width:640px; margin:0 auto; padding:34px 24px calc(var(--asq-nav-h) + env(safe-area-inset-bottom) + 72px); }
#asqContent .eyebrow { display:flex; align-items:center; gap:14px; justify-content:center; color:var(--asq-champagne);
  font-size:18px; letter-spacing:.38em; text-transform:uppercase; font-family:'Cormorant Garamond',serif; font-weight:600; padding-left:.38em; }
#asqContent .eyebrow::before, #asqContent .eyebrow::after { content:""; flex:0 0 44px; height:1px; background:linear-gradient(90deg,transparent,var(--asq-hairline)); }
#asqContent .eyebrow::after { background:linear-gradient(90deg,var(--asq-hairline),transparent); }
#asqContent h1 { font-family:'Cormorant Garamond',serif; font-weight:600; color:var(--asq-champagne); text-align:center; font-size:44px;
  line-height:1.05; letter-spacing:.10em; margin:10px 0 4px; padding-left:.10em; text-shadow:0 0 26px rgba(233,215,174,.18); }
#asqContent .subtitle { display:flex; align-items:center; justify-content:center; gap:10px; font-family:'Cormorant Garamond',serif;
  font-style:italic; font-weight:500; color:var(--asq-champagne); font-size:23px; }
#asqContent .subtitle .orn { color:var(--asq-gold); font-style:normal; font-size:.62em; transform:translateY(1px); }
#asqContent .head-rule { width:min(320px,72%); margin:20px auto 0; height:12px; position:relative; }
#asqContent .head-rule::before { content:""; position:absolute; left:0; right:0; top:5px; height:1px;
  background:linear-gradient(90deg,transparent,var(--asq-hairline) 18%,var(--asq-hairline) 82%,transparent); }
#asqContent .head-rule::after { content:"\25C6"; position:absolute; left:50%; top:0; transform:translateX(-50%); color:var(--asq-gold);
  font-size:9px; background:var(--asq-bg); padding:0 8px; line-height:12px; }
#asqContent section { margin-top:42px; }
#asqContent h2 { font-family:'Cormorant Garamond',serif; font-weight:700; color:var(--asq-gold); font-size:26px; line-height:1.25;
  letter-spacing:.14em; text-transform:uppercase; margin-bottom:16px; }
#asqContent .reading-copy p { font-size:22px; line-height:1.65; color:var(--asq-ivory); margin-bottom:18px; text-shadow:0 1px 2px rgba(0,0,0,.5); }
#asqContent .reading-copy p:last-child { margin-bottom:0; }
#asqContent .reading-copy p.dev-label { font-size:14px; font-style:italic; color:#8b8272; }
#asqContent .divider { margin:40px auto 0; width:100%; height:12px; position:relative; }
#asqContent .divider::before { content:""; position:absolute; left:0; right:0; top:5px; height:1px;
  background:linear-gradient(90deg,transparent,var(--asq-hairline) 20%,var(--asq-hairline) 80%,transparent); }
#asqContent .divider::after { content:"\25C6"; position:absolute; left:50%; top:0; transform:translateX(-50%); color:var(--asq-gold);
  font-size:9px; background:var(--asq-bg); padding:0 8px; line-height:12px; }
#asqNav { position:fixed; left:0; right:0; bottom:0; z-index:40; height:calc(var(--asq-nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom); background:rgba(8,11,17,.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(201,161,94,.18); display:flex; opacity:0; pointer-events:none; transition:opacity .8s ease; }
body.asq-done #asqNav { opacity:1; pointer-events:auto; }
#asqNav a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-decoration:none;
  color:#8b8272; font-size:10.5px; letter-spacing:.06em; font-family:'EB Garamond',serif; }
#asqNav a svg { width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
#asqNav a.active { color:var(--asq-gold); }
@media (prefers-reduced-motion: reduce) { #asqHero.settling { transition:none; } #asqContent.rising { transition:none; } }

/* ---------- dashboard pinch zoom (Sep 1): the landing eases to --dash-zoom-in, which
   pushes the bottom nav pill below the screen; two fingers now zoom the art between
   the whole frame (1) and the landing (--dash-zoom-in) so Home, Saved and Account can
   always be reached. Native browser zoom stays off. ---------- */
.dash { touch-action: none; }
.dash.pinching .stage { transition: none; }

  /* skip-ahead (Sep 1 ruling): subtle gold text, never a button. Appears only on
     a device that has already been through the experience once. */
  .coz-skip { position:fixed; top:calc(env(safe-area-inset-top) + 16px); right:18px; z-index:9999;
    font-family:-apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; font-size:11px; letter-spacing:0.16em;
    text-transform:uppercase; color:rgba(201,161,94,0.55); background:transparent; border:0; padding:10px 6px;
    opacity:0; pointer-events:none; transition:opacity 0.9s ease; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .coz-skip.on { opacity:1; pointer-events:auto; }
  .coz-skip:active { color:rgba(233,215,174,0.9); }

/* one-finger pan (Sep 1): when the dashboard is zoomed in, dragging moves the art up
   and down within its edges so the bottom nav pill can be pulled into view */
.stage { transform: translate(-50%, calc(-50% + var(--dash-pan, 0px))) scale(var(--dash-zoom, 1)); }
.dash.panning .stage { transition: none; }
@keyframes cozPageIn { from { opacity: 0; } to { opacity: 1; } }
body[data-view="reading"] .vedic-reading-page { animation: none; }
.reveal-curtain { transition: opacity 1400ms ease-in-out; }

/* through the sun (Sep 1 ruling): after the burst the camera keeps going, the sun
   fills the screen with light and the reading emerges out of it */

      var open = (s1[0].match(/[^.!?]+[.!?]+/g) || [s1[0]]).slice(0, 2).join(" ");
      var inOpen = (open.match(nameRe) || []).length;
      if (nameTotal !== 1) hard.push("the first name appears " + nameTotal + " times; it must appear exactly once, in the first or second sentence of Section 1");
      else if (inOpen !== 1) hard.push("the first name must appear in the first or second sentence of Section 1");
    }
  }
  return { hard: hard, soft: soft, counts: counts };
}

function generateTropicalReading(chart) {
  var key = null, model = "claude-sonnet-4-6";
  try { key = localStorage.getItem("cozTestApiKey"); model = localStorage.getItem("cozTestModel") || model; } catch (_) {}
  if (!key) return Promise.reject(new Error("No API key set. Open test-index.html and enter your test key first."));
  var ev = cozTropicalEvidence(chart);
  if (!ev.ok) return Promise.reject(new Error("Tropical evidence refused: " + ev.reason));
  var cl = chart.client || {};
  var firstName = String(cl.firstName || cl.displayName || "").trim().split(/\s+/)[0] || "";
  var run = { runId: chart.run.runId, fingerprint: chart.run.fingerprint };
  var inputs = { evidence: ev.text, runId: run.runId, fingerprint: run.fingerprint, firstName: firstName, model: model, promptHash: cozTgenHash(COZ_TGEN_SYSTEM), genVersion: COZ_TGEN_VERSION };

     recorded for other inputs is ignored */

    var priorFailure = new Error("The hidden pre-write failed: " + priorStatus.detail);

  function markFlight(on){ try { if (on) localStorage.setItem(FLIGHT, JSON.stringify({ hash: inputsHash, at: Date.now() })); else localStorage.removeItem(FLIGHT); } catch (e) {} }
  if (flightActive()) {
    try { console.log("[TROPICAL READING] the reading is already being written; waiting for that result"); } catch (e) {}
    return new Promise(function (resolve) { (function poll(){ var c = storedNow(); if (c) { c.trace.fromCache = true; return resolve(c); } if (!flightActive()) return resolve(null); setTimeout(poll, 1200); })(); })
      .then(function (c) {
        if (c) return c;
        var st = cozTgenReadStatus();
        if (st && st.hash === inputsHash && st.phase === "failed") { var f = new Error("The hidden pre-write failed: " + st.detail); f.kind = "contract"; throw f; }
        return generateTropicalReading(chart);

  }

  var userMsg = [
    "First name for the reading: " + (firstName || "(none; use no name)") + ".",
    "Birth (display only, no biography): " + [cl.birthDate, cl.birthTime, cl.locationLabel].filter(Boolean).join(", "),
    "",
    "EVIDENCE",
    ev.text,
    "",
    "Write all six sections now, with the _trace. JSON only."
  ].join("\n");

  function post(body){
    return fetch("https://api.anthropic.com/v1/messages", { method: "POST",
      headers: { "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true", "content-type": "application/json" },
      body: JSON.stringify(body) });
  }
  function request(msg, netRetried){
    var body = { model: model, max_tokens: 7000, system: COZ_TGEN_SYSTEM, messages: [{ role: "user", content: msg }] };
    /* one retry on a genuine connection failure (Safari "Load failed", "Failed to fetch"); API responses are never retried here */
    return post(body).catch(function (e) {
      if (e && e.name === "TypeError" && e.kind !== "saved_no_regen" && !netRetried) { try { console.log("[TROPICAL READING] connection failed, trying once more"); } catch (_) {}
        return new Promise(function (res) { setTimeout(res, 2500); }).then(function(){ return post(body); }); }
      throw e;
    }).then(function (r) { return r.text().then(function (t) { if (!r.ok) throw new Error("API " + r.status + ": " + t.slice(0, 300)); return JSON.parse(t); }); });
  }
  /* returns { sections, trace, raw, usage } or { error, raw, usage } (never throws on model content) */
  function parse(data){
    var text = (data.content || []).filter(function (b) { return b.type === "text"; }).map(function (b) { return b.text; }).join("\n");
    var clean = text.replace(/^```(?:json)?\s*/i, "").replace(/\s*```\s*$/, "").trim();
    var s = clean.indexOf("{"), e = clean.lastIndexOf("}"), obj = null;
    if (s >= 0 && e > s) { try { obj = JSON.parse(clean.slice(s, e + 1)); } catch (pe) { obj = null; } }
    if (!obj || typeof obj !== "object") return { error: "Model did not return valid JSON", raw: text, usage: data.usage || null };
    var out = {};
    vedicReadingSections.forEach(function (sec) { out[sec.id] = Array.isArray(obj[sec.id]) ? obj[sec.id].map(function (p) { return String(p).replace(/\s+/g, " ").trim(); }).filter(Boolean) : []; });

    /* one corrective request naming every hard failure; the reading is never accepted with one remaining */
    cozTgenStatus(inputsHash, "repair sent", chk.hard.slice(0, 3).join("; ") + (chk.hard.length > 3 ? " (+" + (chk.hard.length - 3) + " more)" : ""));
    var note = "Your previous attempt broke these rules: " + chk.hard.join("; ") + ". Keep the same substance and voice; fix only what is named. Return the full JSON again, including _trace.";
    return request(userMsg + "\n\n" + note, false).then(function (data2) {
      requests++;
      var r2 = parse(data2), chk2 = check(r2);
      attempts.push({ counts: chk2.counts, hard: chk2.hard, soft: chk2.soft, raw: r2.raw });
      if (chk2.hard.length) { var f = new Error("Contract violations remained after the single repair: " + chk2.hard.join("; ")); f.kind = "contract"; f.attempts = attempts; f.requests = requests; throw f; }
      return { r: r2, chk: chk2, repaired: true };
    });
  }).then(function (res) {
    markFlight(false); window.COZ_TROPICAL_GEN_PENDING = false;
    var u = res.r.usage || {}, inTok = u.input_tokens || 0, outTok = u.output_tokens || 0;
    var PRICE = { input: 3.00, output: 15.00 }, cost = inTok / 1e6 * PRICE.input + outTok / 1e6 * PRICE.output;
    var wc = {}; vedicReadingSections.forEach(function (s) { var w = cozTgenWords(res.r.sections[s.id]); wc[s.id] = { words: w, band: "245-290", inBand: w >= COZ_TGEN_BANDS.soft[0] && w <= COZ_TGEN_BANDS.soft[1] }; });
    var reading = { system: "tropical", title: "Your Tropical Reading", subtitle: "Your Outer Expression", run: run,
      sections: vedicReadingSections.map(function (s) {
        var per = res.r.trace[s.id], union = []; per.forEach(function (ids) { ids.forEach(function (id) { if (union.indexOf(id) < 0) union.push(id); }); });
        return { id: s.id, number: s.number, title: s.title, body: res.r.sections[s.id], sourceFactors: union };   /* section-level union; paragraph-level in trace.paragraphFactors; never rendered */
      }),
      generatedAt: new Date().toISOString(), genVersion: COZ_TGEN_VERSION,
      trace: { model: model, inputsHash: inputsHash, promptHash: inputs.promptHash, requests: requests, repaired: res.repaired, attempts: attempts, soft: res.chk.soft,
               inputTokens: inTok, outputTokens: outTok, estimatedCostUSD: Math.round(cost * 10000) / 10000, sectionWordCounts: wc,
               evidence: ev.text, evidenceFactors: ev.factors, allowedFactors: ev.allowed, paragraphFactors: res.r.trace, houseRulersAvailable: ev.houseRulersAvailable,
               engineAspects: ev.engineAspects, aspectsUsedInEvidence: COZ_TGEN_ASPECTS_APPROVED, ascPolicy: COZ_TGEN_ASC_POLICY,
               systemPrompt: COZ_TGEN_SYSTEM, userMessage: userMsg, rawResponse: res.r.raw, fromCache: false } };
    try { localStorage.setItem("cozTropicalReading", JSON.stringify(reading)); } catch (_) {}
    cozTgenStatus(inputsHash, "done", requests + " request" + (requests > 1 ? "s" : ""));
    return reading;
  }, function (e) {
    markFlight(false); window.COZ_TROPICAL_GEN_PENDING = false;
    cozTgenStatus(inputsHash, "failed", (e && e.message) || String(e));
    if (e && e.kind === "contract") { window.COZ_TROPICAL_GEN_FAILED_TRACE = { reason: e.message, attempts: e.attempts, requests: e.requests, evidence: ev.text }; try { console.warn("[TROPICAL READING] failed closed:", JSON.stringify(window.COZ_TROPICAL_GEN_FAILED_TRACE)); } catch (_) {} }
    throw e;
  });
}

/* Runs on the dashboard AND in the hidden pre-write (?pregen=1): the finished reading
   lands in cozTropicalReading, keyed to this run, and the page renders only that. On the
   dashboard this never starts a second request: it waits for the pre-write's marker. */
var COZ_READING_READY = Promise.resolve().then(function () {
  var chart = verifiedChart();
  if (!chart) {
    window.COZ_TROPICAL_READING_UNAVAILABLE = true;
    /* T5.1: say WHY the record does not match, so a phone screenshot is enough to diagnose */
    var why = []; try {
      var run = currentRun(), rec = JSON.parse(localStorage.getItem("cozTropicalChartJSON") || "null"), bd = JSON.parse(localStorage.getItem("emergeBirthData") || "null");
      why.push("current run: " + (run ? run.runId + " / " + String(run.fingerprint).slice(0, 12) : "NONE (COZ_ASC.currentRun empty)"));
      why.push("birth record runId: " + (bd && bd.runId ? bd.runId : "NONE"));
      why.push("tropical chart: " + (!rec ? "NONE stored" : "run " + (rec.run ? rec.run.runId + " / " + String(rec.run.fingerprint).slice(0, 12) + " engine " + rec.run.engineVersion : "UNSTAMPED") + ", " + ((rec.bodies || []).length) + " bodies, asc " + (rec.angles && rec.angles.ascendant ? rec.angles.ascendant.sign : "none") + ", generated " + (rec.generatedAt || "?")));
      why.push("restored saved run: " + (localStorage.getItem("cozRestoredRunId") || "no"));
      why.push("recovery marker: " + (run ? (sessionStorage.getItem("cozChartRecovery:" + run.runId) || "no") : "no current run"));
    } catch (e) { why.push("diagnostic error " + e.message); }
    window.COZ_TROPICAL_DEBUG = "No Tropical chart for the current run. " + why.join(" | ");
    return;
  }
  var have = loadReading(); if (have && have.source === "personal") return;      /* already written for this run */
  window.COZ_TROPICAL_GEN_PENDING = true;
  return generateTropicalReading(chart).then(function (reading) {
    window.COZ_TROPICAL_GEN_PENDING = false;
    window.COZ_TROPICAL_READING = reading;
    window.COZ_TROPICAL_GEN_TRACE = reading.trace;
    try { console.log("[TROPICAL READING] " + (reading.trace.fromCache ? "from cache" : "written") + " · " + JSON.stringify(reading.trace.sectionWordCounts) + (reading.trace.soft && reading.trace.soft.length ? " · soft: " + reading.trace.soft.join("; ") : "")); } catch (e) {}
  }).catch(function (e) {

});
function cozTgenUsageLine() {

function cozTgenTraceView(id, paragraphs, loaded){

function idFromHash() {

function showFromHash() {
  const id = idFromHash();
  if (window.COZ_ASQ && id !== "ascendant") window.COZ_ASQ.exit();     /* leaving the ascendant route: full cleanup */
  if (!id || id === "dashboard") {
    if (id !== "dashboard") history.replaceState({ id: "dashboard" }, "", "#/dashboard");

const SIGNS = ["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
const SAMPLE_SIGN_IN_ART = "Leo";   // baked into tropical-dash.jpg and the clip's first frames
const RING_ICON = sign => `ring-${sign.toLowerCase()}.png`;   // his 12 ring icons, in this repo

function verifiedChart() {
  let rec = null; try { rec = JSON.parse(localStorage.getItem("cozTropicalChartJSON") || "null"); } catch (e) {}
  return runMatches(rec, currentRun()) ? rec : null;
}
function resolveAscendant() {
  const pick = v => { if (!v) return null; v = String(v).trim(); v = v.charAt(0).toUpperCase() + v.slice(1).toLowerCase(); return SIGNS.includes(v) ? v : null; };
  /* T3.8: the Tropical Ascendant comes from the current run's verified chart record.
     The URL / stored sign is accepted only when it agrees with that record. With no
     verified record the sign is unknown (null): never Leo, never a stale sign. */
  const run = currentRun();
  let rec = null; try { rec = JSON.parse(localStorage.getItem("cozTropicalChartJSON") || "null"); } catch (e) {}
  if (!runMatches(rec, run) || !rec.angles || !rec.angles.ascendant) return null;
  const verified = pick(rec.angles.ascendant.sign);
  if (!verified) return null;
  const hinted = pick(params.get("asc")) || pick(window.EMERGE_ASCENDANT_TROPICAL);
  if (hinted && hinted !== verified) { try { console.log("[TROPICAL READING] ascendant hint " + hinted + " ignored; verified chart says " + verified); } catch (e) {} }
  return verified;
}

function paintAscendant(stage, sign) {
  const live = !!sign && sign !== SAMPLE_SIGN_IN_ART;
  stage.dataset.ascLive = (sign && sign !== SAMPLE_SIGN_IN_ART) ? "1" : (sign ? "0" : "1");   /* unknown: hide the baked Leo, show nothing */
  stage.querySelector(".asc-glyph").innerHTML = live ? `<img src="${RING_ICON(sign)}" alt="">` : "";
  stage.querySelector(".asc-label").textContent = sign || "";
}

/* Entrance: the whole art is shown first, then it eases in slightly so the type reads larger.
   Once per page load; the reveal's stage shares the variable so the clip matches. */
function dashZoomIn() {
  const target = getComputedStyle(document.documentElement).getPropertyValue("--dash-zoom-in").trim() || "1.12";
  const go = () => document.documentElement.style.setProperty("--dash-zoom", target);
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { go(); return; }
  const art = document.querySelector("#dashStage .stage-art");
  const start = () => setTimeout(go, 1900);   /* Sep 1: the frame fades in first, so the whole art is seen before the ease-in */
  if (art.complete) start(); else art.addEventListener("load", start, { once: true });
}

(function(){
  const dash = document.getElementById("dash"), root = document.documentElement;
  let active = false, startD = 0, startZ = 1, maxZ = 1.3;
  const cur = () => parseFloat(getComputedStyle(root).getPropertyValue("--dash-zoom")) || 1;
  const dist = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  dash.addEventListener("touchstart", e => {
    if (e.touches.length !== 2) return;
    active = true; startD = dist(e) || 1; startZ = cur();
    maxZ = parseFloat(getComputedStyle(root).getPropertyValue("--dash-zoom-in")) || 1.3;
    dash.classList.add("pinching"); window.__dashZoomed = true;
  }, { passive:true });
  dash.addEventListener("touchmove", e => {
    if (!active || e.touches.length !== 2) return;
    e.preventDefault();
    const z = Math.min(maxZ, Math.max(1, startZ * (dist(e) / startD)));
    root.style.setProperty("--dash-zoom", z.toFixed(3));
  }, { passive:false });
  const end = () => { if (!active) return; active = false; dash.classList.remove("pinching"); };
  dash.addEventListener("touchend", end); dash.addEventListener("touchcancel", end);
})();

   user-scalable=no, and that zoom survives a reload, which is what threw the globe
   off on the second run. Native page zoom is refused here; the dashboards keep
   their own two-finger art zoom. */
(function(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }, { passive:false }); });
  document.addEventListener('touchmove', function(e){ if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive:false });
})();

/* ---------- one-finger pan on the zoomed dashboard (Sep 1) ---------- */
(function(){
  const dash = document.getElementById("dash"), stage = document.getElementById("dashStage"), root = document.documentElement;
  let panning = false, startY = 0, startPan = 0, moved = false;
  const zoom = () => parseFloat(getComputedStyle(root).getPropertyValue("--dash-zoom")) || 1;
  const pan = () => parseFloat(getComputedStyle(root).getPropertyValue("--dash-pan")) || 0;
  const limit = () => Math.max(0, (stage.offsetHeight * zoom() - window.innerHeight) / 2);
  dash.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || zoom() <= 1.001) return;
    panning = true; moved = false; startY = e.touches[0].clientY; startPan = pan();
  }, { passive:true });
  dash.addEventListener("touchmove", e => {
    if (!panning || e.touches.length !== 1) return;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dy) > 6) moved = true;
    if (!moved) return;
    e.preventDefault(); dash.classList.add("panning");
    const L = limit(); const y = Math.max(-L, Math.min(L, startPan + dy));
    root.style.setProperty("--dash-pan", y.toFixed(1) + "px");
  }, { passive:false });
  const end = () => { panning = false; dash.classList.remove("panning"); };
  dash.addEventListener("touchend", end); dash.addEventListener("touchcancel", end);
  /* a real drag must not count as a tap on the hotspot underneath */
  dash.addEventListener("click", e => { if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
})();


/* ---------- through the sun + text zoom (Sep 1) ---------- */
(function(){
  const light = document.createElement("div"); light.id = "cozLight"; document.body.appendChild(light);
  window.__cozLightIn  = () => { light.classList.add("on"); };
  window.__cozLightOut = () => { requestAnimationFrame(() => requestAnimationFrame(() => light.classList.remove("on"))); };
})();
(function(){
  const root = document.documentElement;
  let active = false, startD = 0, startZ = 1;
  const inText = () => document.body.dataset.view === "reading" || document.body.dataset.view === "ascendant";
  const cur = () => parseFloat(getComputedStyle(root).getPropertyValue("--coz-text-zoom")) || 1;
  const dist = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  document.addEventListener("touchstart", e => { if (!inText() || e.touches.length !== 2) return; active = true; startD = dist(e) || 1; startZ = cur(); }, { passive:true });
  document.addEventListener("touchmove", e => {
    if (!active || e.touches.length !== 2) return;
    e.preventDefault();
    const z = Math.min(2, Math.max(1, startZ * (dist(e) / startD)));
    root.style.setProperty("--coz-text-zoom", z.toFixed(3));
  }, { passive:false });
  const end = () => { active = false; };
  document.addEventListener("touchend", end); document.addEventListener("touchcancel", end);
})();


/* Sep 20: un-zoom the reveal stage during the gold light (3.6s in), restore on exit. */
(function () {
  var st = document.querySelector(".reveal .stage");
  if (!st) return;
  var t = null;
  var vid = document.querySelector(".reveal video");
  if (!vid) return;
  function unzoom() {
    var w = st.offsetWidth, h = st.offsetHeight;
    if (!w || !h) return;
    /* Sep 22: the whole clip frame stays visible during the flight (no cropping of the
       planets), so the stage returns to exactly 1 rather than a screen-covering scale */
    st.style.setProperty("--reveal-zoom", String(Math.max(innerWidth / w, innerHeight / h) * 1.002)
 );
  }
  function reset() { clearTimeout(t); st.style.removeProperty("--reveal-zoom"); }
  vid.addEventListener("playing", function () { clearTimeout(t); t = setTimeout(unzoom, 3600); });
  vid.addEventListener("ended", reset);
  vid.addEventListener("error", reset);
  vid.addEventListener("pause", function () { if (vid.currentTime === 0) reset(); });
})();
</script>
</body>
