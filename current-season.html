<!--
  COZALYZE · CURRENT SEASON · CS1.0
  Reached from current-life-cycle.html.

  One reusable template. No lord, date, house, nakshatra or sentence about any
  single chart is baked in. Everything below is composed at runtime from
  localStorage "cozChartJSON": the lifeCycle block for timing, the planets
  array for verified natal placements.

  Composition follows the approved engine specification:
    - claims are drafted only from supplied factors,
    - each materially personalised claim needs two independent supporting
      factors, counted once per underlying factor (synonyms do not count twice),
    - optional modifiers are omitted when absent, never inferred,
    - the page fails closed when a core item is missing,
    - the claim ledger is developer-only and never reaches the customer view.

  SCOPE NOTE (read before trusting the prose): this composer works from the
  factors the master actually verifies today: period lords, natal sign, Whole
  Sign house, nakshatra, pada and verified same-house co-presence. The master's
  cozChartJSON carries no house rulerships, no graha drishti, no dispositor
  links and no dignity data, so those layers of the specification are not
  implemented and the corresponding claims are never drafted. Depth is
  therefore below the reference sample in charts whose richness came from those
  missing layers. This is a stated gap, not a silent shortfall.
-->

<style>
:root {
  --vedic-navy: #000f26;
  --vedic-gold: #d4a178;
  --vedic-gold-muted: rgba(212, 161, 120, 0.65);
  --vedic-ivory: #e5d4c5;
  --vedic-ivory-muted: rgba(229, 212, 197, 0.88);
  --display-font: "Cormorant Garamond", Georgia, serif;
  --body-font: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --asq-gold: #c9a15e;
  --asq-nav-h: 64px;
  --side-pad: 22px;
}
@media (max-width: 374px) { :root { --side-pad: 17px; } }

* { box-sizing: border-box; }
html { background: var(--vedic-navy); -webkit-text-size-adjust: 100%; }
body {
  margin:0; background:var(--vedic-navy); color:var(--vedic-ivory);
  font-family:var(--body-font); -webkit-font-smoothing:antialiased;
}

/* Header strip: the moon artwork, cropped, with the logo over it. */
.cs-head {
  position:relative; height:118px; overflow:hidden;
  border-bottom:1px solid rgba(212,161,120,.28);
}
.cs-head-img {
  position:absolute; inset:0;
  background-image:url("vedic-moon-bg.png");
  background-size:cover; background-position:center 22%;
}
.cs-head-img::after {
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(0,15,38,.34), rgba(0,15,38,.86));
}
.cs-head-in { position:relative; z-index:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.vedic-logo { display:block; width:64px; height:auto; margin:0 auto 1px; }
.cs-brand { font-family:var(--display-font); font-size:16px; letter-spacing:.05em; color:var(--vedic-gold); margin:0; }

/* Reading panel: the framed card from the approved artwork, rendered in CSS
   so it reflows to any text length instead of being a fixed-size image. */
.cs-wrap { max-width:620px; margin:0 auto; padding:16px var(--side-pad) calc(var(--asq-nav-h) + 74px); }
.cs-panel {
  position:relative; border:1.5px solid var(--vedic-gold); border-radius:16px;
  background:rgba(4,20,45,.72); padding:30px 24px 28px;
}
.cs-panel::before, .cs-panel::after {
  content:""; position:absolute; width:40px; height:40px; pointer-events:none;
  border:1px solid var(--vedic-gold-muted); opacity:.5;
}
.cs-panel::before { top:8px; left:8px; border-right:0; border-bottom:0; border-radius:10px 0 0 0; }
.cs-panel::after { bottom:8px; right:8px; border-left:0; border-top:0; border-radius:0 0 10px 0; }

.cs-eyebrow {
  text-align:center; font-family:var(--display-font);
  font-size:clamp(17px,4.6vw,20px); color:var(--vedic-gold);
  letter-spacing:.02em; margin:0 0 3px;
}
.cs-pair {
  text-align:center; font-family:var(--display-font); font-weight:500;
  font-size:clamp(26px,7vw,33px); letter-spacing:.05em; color:#fff;
  margin:0 0 16px; text-transform:uppercase;
}

/* Paired medallions with the connector from the approved artwork. */
.cs-pairmark { display:flex; align-items:center; justify-content:center; gap:0; margin:0 0 16px; }
.cs-pairmark .cs-join { width:46px; height:1.5px; background:var(--vedic-gold); position:relative; }
.cs-pairmark .cs-join::after {
  content:""; position:absolute; left:50%; top:50%; width:8px; height:8px;
  transform:translate(-50%,-50%) rotate(45deg); background:var(--vedic-navy);
  border:1.5px solid var(--vedic-gold);
}
.coz-medallion {
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:50%; color:var(--vedic-gold); border:1.5px solid var(--vedic-gold);
  background:radial-gradient(circle at 50% 38%, rgba(212,161,120,.15), rgba(0,15,38,.7) 72%);
}
.coz-medallion svg { stroke:currentColor; fill:none; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }

.cs-dates {
  text-align:center; font-family:var(--body-font);
  font-size:clamp(14px,3.8vw,16px); letter-spacing:.05em;
  color:var(--vedic-ivory); margin:0 0 14px;
}
.cs-rule { display:flex; align-items:center; justify-content:center; gap:10px; margin:16px auto; max-width:360px; }
.cs-rule i { flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--vedic-gold-muted),transparent); }
.cs-rule b { width:6px; height:6px; border-radius:50%; background:var(--vedic-gold); opacity:.9; }

.cs-lede {
  text-align:center; font-family:var(--display-font);
  font-size:clamp(18px,4.8vw,21px); line-height:1.5;
  color:var(--vedic-gold); margin:0 0 4px;
}
h1.cs-h1 {
  text-align:center; font-family:var(--display-font); font-weight:500;
  font-size:clamp(23px,6vw,28px); line-height:1.24; color:#fff;
  margin:18px 0 16px; letter-spacing:.012em;
}
.cs-intro p {
  font-family:var(--body-font); font-size:clamp(13.5px,3.6vw,14.8px);
  line-height:1.78; color:var(--vedic-ivory-muted);
  margin:0 0 13px; text-align:center;
}
.cs-reading p {
  font-family:var(--body-font); font-size:clamp(13.5px,3.6vw,14.8px);
  line-height:1.82; color:var(--vedic-ivory); margin:0 0 15px;
}
.cs-disclaimer {
  text-align:center; font-family:var(--body-font);
  font-size:clamp(12.5px,3.3vw,13.6px); line-height:1.7;
  color:var(--vedic-ivory-muted); margin:6px 0 0;
}

.cs-explore { margin:26px 0 0; }
.cs-explore h2 {
  font-family:var(--display-font); font-size:clamp(17px,4.5vw,19px);
  color:var(--vedic-gold); font-weight:500; margin:0 0 10px; letter-spacing:.015em;
}
.cs-row {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  width:100%; border:0; border-top:1px solid rgba(212,161,120,.22);
  background:none; color:var(--vedic-ivory); text-align:left;
  padding:14px 2px; font-family:var(--display-font);
  font-size:clamp(16px,4.3vw,18px); cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.cs-row:last-of-type { border-bottom:1px solid rgba(212,161,120,.22); }
.cs-row .cs-chev { color:var(--vedic-gold-muted); font-size:17px; }
.cs-row[aria-disabled="true"] { opacity:.45; cursor:default; }
.cs-nav { display:flex; justify-content:space-between; gap:14px; margin:20px 0 0; }
.cs-nav a {
  font-family:var(--body-font); font-size:13.5px; letter-spacing:.03em;
  color:var(--vedic-gold); text-decoration:none;
}
.cs-nav a:focus-visible { outline:1px solid var(--vedic-gold); outline-offset:3px; }
.cs-nav span { opacity:.4; color:var(--vedic-ivory-muted); font-family:var(--body-font); font-size:13.5px; }

.cs-empty { padding:28px 22px; text-align:center; }
.cs-empty h2 { font-family:var(--display-font); font-weight:600; font-size:clamp(21px,5.6vw,25px); color:#fff; margin:0 0 10px; }
.cs-empty p { font-family:var(--body-font); font-size:14.5px; line-height:1.66; color:var(--vedic-ivory-muted); margin:0; }

#cozFoot {
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(8,11,17,.86);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(201,161,94,.18);
}
#cozFoot .coz-foot-tag {
  text-align:center; font-family:'EB Garamond',serif; font-style:italic;
  font-size:13px; letter-spacing:.04em; color:#8b8272; padding:11px 20px 3px;
}
#cozFoot .coz-foot-links { display:flex; height:var(--asq-nav-h); }
#cozFoot a {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; text-decoration:none; color:#8b8272; font-size:10.5px; letter-spacing:.06em;
  font-family:'EB Garamond',serif; -webkit-tap-highlight-color:transparent;
}
#cozFoot a svg { width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
#cozFoot a:active { color:var(--asq-gold); }

.cs-stamp {
  position:fixed; left:6px; bottom:calc(var(--asq-nav-h) + 30px); z-index:50;
  font:10px/1 "SF Mono", Menlo, monospace; color:rgba(229,212,197,.22); pointer-events:none;
}
@media print { .cs-head-img, #cozFoot, .cs-stamp { display:none !important; } }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>

  </div>

<div class="cs-stamp" aria-hidden="true">CURRENT SEASON · CS1.0</div>

<script src="coz-graha.js"></script>
<script>
(function () {
  'use strict';
  var G = window.COZ_GRAHA;
  var panel = document.getElementById('csPanel');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var DISCLAIMER = 'These are themes that may be present during this period\u2014not predictions of what will happen.';

  /* Nakshatra modifiers: motivation/direction only, connected back to the
     graha and its house by the composer. Never rendered as standalone
     encyclopedia text, no mythology or deities. */
  var NAK = {
    'Ashwini':'a quick, initiating quality and a pull toward fresh starts',
    'Bharani':'a pattern of carrying something through to its conclusion',
    'Krittika':'a clarifying, cutting-through quality that separates what matters from what does not',
    'Rohini':'a steady, cultivating quality that wants something to grow and last',
    'Mrigashira':'a searching quality that keeps looking for the thing not yet found',
    'Ardra':'a quality of necessary upheaval that clears the ground',
    'Punarvasu':'themes of renewal, restoration, and returning to what feels essential',
    'Pushya':'a nourishing, protective quality that steadies what it holds',
    'Ashlesha':'a close-held, perceptive quality attentive to undercurrents',
    'Magha':'an awareness of lineage, inheritance, and what was handed down',
    'P.Phalguni':'a pull toward ease, pleasure, and shared enjoyment',
    'U.Phalguni':'a preference for steady arrangements and dependable commitments',
    'Hasta':'a practical, skilled quality that wants to shape things by hand',
    'Chitra':'an eye for form and design, and a wish to make something well',
    'Swati':'an independent, self-directed quality that resists being held',
    'Vishakha':'a focused, goal-directed quality that pursues one aim at a time',
    'Anuradha':'a loyal, cooperative quality that builds through relationship',
    'Jyeshtha':'a protective, senior quality that takes responsibility',
    'Mula':'an instinct to reach the root and remove what is unnecessary',
    'P.Ashadha':'an invigorating quality that revives momentum',
    'U.Ashadha':'a persistent quality oriented toward lasting results',
    'Shravana':'a listening, learning quality that gathers understanding',
    'Dhanishta':'a rhythmic, capable quality suited to sustained effort',
    'Shatabhisha':'a private, investigative quality drawn to what is hidden',
    'P.Bhadrapada':'an intense quality willing to sit with difficulty',
    'U.Bhadrapada':'a deep, settling quality that seeks calm beneath the surface',
    'Revati':'a pattern of completion, transition, and carrying forward what remains meaningful at the end of a cycle'
  };
  /* Full names used by the birth-chart record map onto the short forms above. */
  var NAK_ALIAS = {
    'Purva Phalguni':'P.Phalguni','Uttara Phalguni':'U.Phalguni',
    'Purva Ashadha':'P.Ashadha','Uttara Ashadha':'U.Ashadha',
    'Purva Bhadrapada':'P.Bhadrapada','Uttara Bhadrapada':'U.Bhadrapada'
  };
  function nakText(n) { if (!n) return null; return NAK[n] || NAK[NAK_ALIAS[n]] || null; }

  /* Pada modifiers: manner of expression only. */
  var PADA = {
    1: 'Its first pada adds an initiating, self-starting emphasis',
    2: 'Its second pada adds a practical emphasis on what can actually be built or kept',
    3: 'Its third pada adds a thoughtful, communicative quality and a willingness to consider more than one possibility',
    4: 'Its fourth pada adds an emphasis on emotional meaning and on what feels settled'
  };

  /* ---------------- Evidence ledger (developer-only) ---------------- */
  var ledger = [];
  function claim(text, factors, note) {
    var unique = {}, n = 0;
    for (var i = 0; i < factors.length; i++) { if (!unique[factors[i]]) { unique[factors[i]] = 1; n++; } }
    var ok = n >= 2;
    ledger.push({ claim: text.slice(0, 74) + (text.length > 74 ? '\u2026' : ''),
                  factors: Object.keys(unique), count: n,
                  result: ok ? 'included' : 'omitted (under two independent factors)',
                  note: note || '' });
    return ok ? text : null;
  }

  function failClosed(reason) {
    panel.innerHTML =
      '<div class="cs-empty">' +
        '<h2>Your season reading is not ready yet</h2>' +
        '<p>Your chart is saved to this device when your reading is prepared. Open your reading first, then return here.</p>' +
      '</div>';
    if (window.console) console.warn('[CURRENT SEASON] fail-closed: ' + reason);
  }

  /* ---------------- Load and validate ---------------- */
  var chart = G.readChart();
  if (!chart) { failClosed('no cozChartJSON on this device'); return; }
  var lc = chart.lifeCycle;
  if (!lc || !lc.mahadasha || !lc.antardasha) { failClosed('timing data incomplete'); return; }

  var md = lc.mahadasha, ad = lc.antardasha;
  var mdP = G.planet(chart, md.lord), adP = G.planet(chart, ad.lord);

  /* Core requirements from the specification: verified sign, house,
     nakshatra and pada for BOTH active lords. Missing any one fails closed. */
  function complete(p) {
    return p && p.signNumber >= 1 && p.signNumber <= 12 &&
           p.house >= 1 && p.house <= 12 && p.nakshatra && p.pada >= 1 && p.pada <= 4;
  }
  if (!complete(mdP)) { failClosed('Mahadasha lord ' + md.lord + ' lacks verified sign/house/nakshatra/pada'); return; }
  if (!complete(adP)) { failClosed('Antardasha lord ' + ad.lord + ' lacks verified sign/house/nakshatra/pada'); return; }

  /* ---------------- Compose ---------------- */
  var paras = [];

  /* 1. The larger chapter. Factors: active MD status + verified house. */
  var mdArea = G.HOUSE_AREAS[mdP.house], mdOrd = G.ordinal(mdP.house);
  var p1 = claim(
    'Your larger ' + esc(md.lord) + ' chapter can bring ' + esc(G.THEMES[md.lord]) +
    ' into longer-term focus. Because ' + esc(md.lord) + ' occupies the ' + esc(mdOrd) +
    ' house of your birth chart, that emphasis may settle most noticeably around ' + esc(mdArea) +
    '. What receives attention here tends to develop over years rather than weeks.',
    ['md_active', 'md_house_' + mdP.house]
  );
  if (p1) paras.push(p1);

  /* 2. Nakshatra and pada of the MD lord, tied back to graha and house. */
  var mdNak = nakText(mdP.nakshatra);
  if (mdNak) {
    var p2 = claim(
      esc(md.lord) + '\u2019s placement in ' + esc(mdP.nakshatra) + ' adds ' + esc(mdNak) +
      '. ' + esc(PADA[mdP.pada]) + ', which may shape how this longer chapter is approached rather than what it concerns.',
      ['md_nakshatra_' + mdP.nakshatra, 'md_pada_' + mdP.pada, 'md_active']
    );
    if (p2) paras.push(p2);
  }

  /* 3. The current season. Factors: active AD status + verified house. */
  var adArea = G.HOUSE_AREAS[adP.house], adOrd = G.ordinal(adP.house);
  var p3 = claim(
    esc(ad.lord) + ' now shapes the current season within that larger chapter. ' + esc(ad.lord) +
    ' brings ' + esc(G.THEMES[ad.lord]) + ' into focus. In your chart ' + esc(ad.lord) +
    ' occupies the ' + esc(adOrd) + ' house, the area connected with ' + esc(adArea) +
    '. This may place nearer-term attention there than the wider chapter alone would suggest.',
    ['ad_active', 'ad_house_' + adP.house]
  );
  if (p3) paras.push(p3);

  /* 4. Nakshatra and pada of the AD lord. */
  var adNak = nakText(adP.nakshatra);
  if (adNak) {
    var p4 = claim(
      esc(ad.lord) + '\u2019s placement in ' + esc(adP.nakshatra) + ' adds ' + esc(adNak) +
      '. ' + esc(PADA[adP.pada]) + '. During this season these may describe the manner in which those themes come forward.',
      ['ad_nakshatra_' + adP.nakshatra, 'ad_pada_' + adP.pada, 'ad_active']
    );
    if (p4) paras.push(p4);
  }

  /* 5. Verified co-presence. Optional modifier: omitted entirely when absent,
     never inferred. Factors: AD house + another graha verified in that house. */
  var mates = G.coTenants(chart, ad.lord);
  if (mates.length) {
    var names = mates.length === 1 ? mates[0]
              : mates.slice(0, -1).join(', ') + ' and ' + mates[mates.length - 1];
    var themeBits = [];
    for (var m = 0; m < mates.length && m < 2; m++) if (G.THEMES[mates[m]]) themeBits.push(G.THEMES[mates[m]]);
    if (themeBits.length) {
      var p5 = claim(
        esc(names) + (mates.length > 1 ? ' also occupy' : ' also occupies') +
        ' this area of your birth chart, adding questions of ' + esc(themeBits.join('; and ')) +
        ' to ' + esc(adOrd) + '-house matters. You may find these threads harder to separate than usual during this season.',
        ['ad_house_' + adP.house, 'cotenancy_' + mates.join('_')]
      );
      if (p5) paras.push(p5);
    }
  }

  /* 6. Lord-to-lord synthesis. Same house, same sign, or contrast. This is
     the paragraph that must explain a pattern rather than append two others. */
  var sameHouse = (mdP.house === adP.house), sameSign = (mdP.signNumber === adP.signNumber);
  var syn;
  if (sameHouse) {
    syn = claim(
      esc(md.lord) + ' and ' + esc(ad.lord) + ' occupy the same house in your chart, so the season and the chapter point at the same part of life rather than pulling apart. That can concentrate attention: what the longer chapter has been slowly reshaping may become more immediate now, in the area of ' + esc(adArea) + '.',
      ['md_house_' + mdP.house, 'ad_house_' + adP.house, 'md_active', 'ad_active']
    );
  } else if (sameSign) {
    syn = claim(
      esc(md.lord) + ' and ' + esc(ad.lord) + ' share a sign in your chart, which can give the season and the wider chapter a similar manner even though they activate different areas of life. The style may feel consistent while the subject changes.',
      ['md_sign_' + mdP.signNumber, 'ad_sign_' + adP.signNumber, 'md_active']
    );
  } else {
    syn = claim(
      esc(md.lord) + ' and ' + esc(ad.lord) + ' work on different areas of your chart, so this season may involve holding two emphases at once: the longer concern of ' + esc(mdArea) + ', and the nearer one of ' + esc(adArea) +
      '. The work of the period may be less about choosing between them than about letting each have its proper place.',
      ['md_house_' + mdP.house, 'ad_house_' + adP.house, 'md_active', 'ad_active']
    );
  }
  if (syn) paras.push(syn);

  /* ---------------- Render ---------------- */
  var lede = 'A season of ' + esc(G.THEMES[ad.lord].split(',')[0]) + ' within a longer chapter of ' +
             esc(G.THEMES[md.lord].split(',')[0]) + '.';

  panel.innerHTML =
    '<p class="cs-eyebrow">Your Current Season</p>' +
    '<p class="cs-pair">' + esc(md.lord) + ' \u2013 ' + esc(ad.lord) + '</p>' +
    '<div class="cs-pairmark">' + G.medallion(md.lord, 62) + '<span class="cs-join"></span>' + G.medallion(ad.lord, 62) + '</div>' +
    '<p class="cs-dates">' + esc(ad.displayStartDate) + ' \u2013 ' + esc(ad.displayEndDate) + '</p>' +
    '<div class="cs-rule" aria-hidden="true"><i></i><b></b><i></i></div>' +
    '<p class="cs-lede">' + lede + '</p>' +
    '<div class="cs-rule" aria-hidden="true"><i></i><b></b><i></i></div>' +

    '<h1 class="cs-h1">Understanding<br>Your Current Season</h1>' +
    '<div class="cs-intro">' +
      '<p>Vimshottari Dasha is a Vedic timing system that maps your life through a sequence of planetary periods calculated from the Moon\u2019s position at birth. The Mahadasha describes the larger chapter unfolding over several years, while the Antardasha describes the shorter season operating within that chapter.</p>' +
      '<p>These periods do not determine exactly what will happen. Instead, they indicate themes and areas of life that may receive greater attention. Your reading combines the active Mahadasha and Antardasha with their placements in your birth chart to explore how this particular season may express itself for you.</p>' +
